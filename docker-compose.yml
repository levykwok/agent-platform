services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        JAR_FILE: target/agent-platform-0.1.0-SNAPSHOT.jar
    image: agent-platform-backend:local
    container_name: agent-platform-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AGENT_PLATFORM_WORKSPACE: /app/workspace
      # Optional RAG; leave empty/disabled if Qdrant is not running.
      AGENT_PLATFORM_QDRANT_ENABLED: "${AGENT_PLATFORM_QDRANT_ENABLED:-false}"
      AGENT_PLATFORM_QDRANT_ENDPOINT: "${AGENT_PLATFORM_QDRANT_ENDPOINT:-http://qdrant:6333}"
    volumes:
      - ./workspace:/app/workspace
    networks:
      - agent-platform

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: agent-platform-frontend:local
    container_name: agent-platform-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:8080
    depends_on:
      - backend
    networks:
      - agent-platform

  # Optional. Start with: docker compose --profile rag up -d
  qdrant:
    profiles: ["rag"]
    image: qdrant/qdrant:v1.18.2
    container_name: agent-platform-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - agent-platform

networks:
  agent-platform:

volumes:
  qdrant-storage:
